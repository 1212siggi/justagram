
name: Build JustAgram iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.app
          xcodebuild -version

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and sync
        run: bun run sync
        
      - name: Enable iOS swipe navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = list(Path("ios").rglob("CDVWKInAppBrowser.m"))
          if len(files) != 1:
              raise SystemExit(f"Expected one iOS plugin file, found {len(files)}")

          path = files[0]
          source = path.read_text()

          old = "self.webView.allowsBackForwardNavigationGestures = NO;"
          new = "self.webView.allowsBackForwardNavigationGestures = YES;"

          if source.count(old) != 1:
              raise SystemExit("Could not locate the expected swipe setting")

          path.write_text(source.replace(old, new))
          print(f"Enabled swipe navigation in {path}")
          PY

      - name: Build unsigned iOS app
        run: |
          if [ -d ios/App/App.xcworkspace ]; then
            PROJECT_TYPE="-workspace"
            PROJECT_PATH="ios/App/App.xcworkspace"
          else
            PROJECT_TYPE="-project"
            PROJECT_PATH="ios/App/App.xcodeproj"
          fi

          xcodebuild "$PROJECT_TYPE" "$PROJECT_PATH" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry JustAgram.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: JustAgram-iPhone
          path: JustAgram.ipa
          retention-days: 7
  
