
name: Build JustAgram iOS

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          sudo xcode-select -s /Applications/Xcode_26.0.app
          xcodebuild -version

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build and sync
        run: bun run sync

      - name: Build unsigned iOS app
        run: |
          if [ -d ios/App/App.xcworkspace ]; then
            PROJECT_TYPE="-workspace"
            PROJECT_PATH="ios/App/App.xcworkspace"
          else
            PROJECT_TYPE="-project"
            PROJECT_PATH="ios/App/App.xcodeproj"
          fi

          xcodebuild "$PROJECT_TYPE" "$PROJECT_PATH" \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/App.app Payload/
          zip -qry JustAgram.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: JustAgram-iPhone
          path: JustAgram.ipa
          retention-days: 7
  
